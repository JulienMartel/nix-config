# Which secrets this machine needs — never their values.
#
# The rice ships secretspec and points it at the macOS login keychain
# (haus.secrets.provider = "keyring"), so values live encrypted at rest and
# reach a process only through `secretspec run`. This file is the committable
# half: on a fresh Mac, `secretspec check` here lists exactly what still needs
# entering, which is what the old hand-carried ~/.secrets dir used to be for.
#
#   secretspec check                     # what's missing
#   secretspec set NAME                  # prompts, hidden
#   secretspec run -- cmd                # inject into just that process
#   eval "$(secretspec export --format shell)"   # or into this shell
[project]
name = "nix"
revision = "1.0"

[profiles.default]
ANTHROPIC_API_KEY = { description = "Anthropic API key (Claude API, not the Claude Code subscription)", required = false }
GOOGLE_API_KEY = { description = "Google API key", required = false }
TELEGRAM_BOT_TOKEN = { description = "Telegram bot token", required = false }
WEATHER_API_KEY = { description = "Weather API key", required = false }
