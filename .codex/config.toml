# Project-scoped Codex config for this machine's nix-darwin config.
#
# Instructions: AGENTS.md at the repo root — Codex reads it natively, no wiring.
# Flows (/rebuild): .agents/skills/, which Codex scans as project-level skills.
# Both are shared with every other client; see .agents/README.md.
#
# This file only carries the one thing AGENTS.md can't express: the session hook
# that installs Nix in a cloud container.

[features]
codex_hooks = true

# Two caveats, both upstream, both harmless if they bite:
#   * repo-local hooks have historically not fired in every interactive session
#     (openai/codex#17532);
#   * the fallback is the same as for any harness with no hooks at all: run ./.agents/setup.sh once.
